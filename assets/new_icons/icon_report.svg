<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e2e" />
      <stop offset="100%" stop-color="#06121c" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#00ff88" />
    </linearGradient>
  </defs>

  <!-- Outer Glow Halo -->
  <rect x="40" y="32" width="176" height="198" rx="18" fill="none" stroke="#00ff88" stroke-width="12" opacity="0.25" filter="url(#glow-green)" />

  <!-- Clipboard / Tablet Sheet Base -->
  <rect x="44" y="36" width="168" height="190" rx="16" fill="url(#sheetGrad)" stroke="url(#neonGreen)" stroke-width="4.5" />

  <!-- Top Mechanical Clip -->
  <path d="M 86 36 L 86 24 C 86 20 90 16 94 16 L 162 16 C 166 16 170 20 170 24 L 170 36 Z" 
        fill="#00ff88" opacity="0.9" />
  <rect x="98" y="24" width="60" height="20" rx="4" fill="#040b12" stroke="#00f3ff" stroke-width="2" />

  <!-- Diagnostic Analytics Header Lines -->
  <line x1="68" y1="72" x2="136" y2="72" stroke="#00f3ff" stroke-width="5" stroke-linecap="round" />
  <line x1="68" y1="92" x2="188" y2="92" stroke="#00aaff" stroke-width="3" stroke-linecap="round" opacity="0.6" />

  <!-- Analytics Bar Chart Graphic inside Document -->
  <g transform="translate(66, 116)">
    <!-- Base Axis -->
    <line x1="0" y1="62" x2="124" y2="62" stroke="#00f3ff" stroke-width="3" opacity="0.5" />
    <!-- Bar 1 -->
    <rect x="8" y="34" width="18" height="28" rx="3" fill="#00aaff" opacity="0.75" />
    <!-- Bar 2 -->
    <rect x="36" y="18" width="18" height="44" rx="3" fill="#00f3ff" filter="url(#glow-green)" />
    <!-- Bar 3 -->
    <rect x="64" y="6" width="18" height="56" rx="3" fill="#00ff88" filter="url(#glow-green)" />
    <!-- Bar 4 -->
    <rect x="92" y="24" width="18" height="38" rx="3" fill="#00d4aa" opacity="0.85" />
    <!-- Trend Line across bars -->
    <path d="M 17 30 L 45 14 L 73 2 L 101 20" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Verified Security Stamp in bottom right corner -->
  <g transform="translate(164, 172)">
    <circle cx="20" cy="20" r="22" fill="#07201c" stroke="#00ff88" stroke-width="3.5" filter="url(#glow-green)" />
    <path d="M 11 20 L 17 26 L 30 13" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>