<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#b026ff" />
      <stop offset="100%" stop-color="#ff00a0" />
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18112e" />
      <stop offset="100%" stop-color="#0d091a" />
    </linearGradient>
  </defs>

  <!-- Outer Glow Halo -->
  <rect x="36" y="28" width="184" height="200" rx="20" fill="none" stroke="#b026ff" stroke-width="12" opacity="0.25" filter="url(#glow-purple)" />

  <!-- Main Disk / Cartridge Body -->
  <path d="M 44 32 L 176 32 L 214 70 L 214 218 C 214 224 210 228 204 228 L 52 228 C 46 228 42 224 42 218 L 42 42 C 42 36 46 32 52 32 Z" 
        fill="url(#bodyGrad)" stroke="url(#purpleGrad)" stroke-width="5" stroke-linejoin="round" />

  <!-- Top Shutter Window (Cyber Floppy / Flash style) -->
  <path d="M 76 34 L 76 96 C 76 100 80 104 84 104 L 172 104 C 176 104 180 100 180 96 L 180 34 Z" 
        fill="#0a0518" stroke="#b026ff" stroke-width="3" />
  <rect x="142" y="46" width="22" height="42" rx="4" fill="#00f3ff" opacity="0.9" filter="url(#glow-purple)" />

  <!-- Center Memory Window with Flash Download Arrow -->
  <rect x="62" y="122" width="132" height="90" rx="10" fill="#0c071d" stroke="#00f3ff" stroke-width="3" />

  <!-- Glowing Download / Save Arrow -->
  <g filter="url(#glow-purple)">
    <line x1="128" y1="136" x2="128" y2="182" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
    <path d="M 106 164 L 128 186 L 150 164" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="100" y1="198" x2="156" y2="198" stroke="#00f3ff" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Corner Tech Accents -->
  <circle cx="56" cy="208" r="4.5" fill="#ff00a0" />
  <line x1="70" y1="218" x2="108" y2="218" stroke="#b026ff" stroke-width="2" />
</svg>