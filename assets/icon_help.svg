<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <filter id="glow-ai" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="45%" stop-color="#00c8ff" />
      <stop offset="80%" stop-color="#9d00ff" />
      <stop offset="100%" stop-color="#bd00ff" />
    </linearGradient>
    <radialGradient id="hexBack" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1f36" />
      <stop offset="70%" stop-color="#071220" />
      <stop offset="100%" stop-color="#030810" />
    </radialGradient>
  </defs>

  <!-- Outer HUD Ring Accent -->
  <circle cx="128" cy="128" r="102" fill="none" stroke="#00f3ff" stroke-width="10" opacity="0.18" filter="url(#glow-ai)" />
  <circle cx="128" cy="128" r="104" fill="none" stroke="#00f3ff" stroke-width="2.5" stroke-dasharray="14 10 3 10" opacity="0.8" />

  <!-- Center Back Hexagon subtle backing with Cyber Border -->
  <polygon points="128,38 206,83 206,173 128,218 50,173 50,83" fill="url(#hexBack)" stroke="#00f3ff" stroke-width="2.5" opacity="0.75" />
  <polygon points="128,44 201,86 201,170 128,212 55,170 55,86" fill="none" stroke="#bd00ff" stroke-width="1.2" opacity="0.5" />

