<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <filter id="glow-lang" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#9d00ff" />
    </linearGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#163258" />
      <stop offset="60%" stop-color="#0a182d" />
      <stop offset="100%" stop-color="#050c18" />
    </radialGradient>
  </defs>

  <!-- Outer Orbit Ring Aura -->
  <ellipse cx="128" cy="128" rx="104" ry="46" transform="rotate(-25 128 128)" 
           fill="none" stroke="#00f3ff" stroke-width="12" opacity="0.22" filter="url(#glow-lang)" />

  <!-- Sphere Background - Prominent r=92 -->
  <circle cx="128" cy="128" r="92" fill="url(#sphereGrad)" stroke="url(#globeGrad)" stroke-width="5" filter="url(#glow-lang)" />

  <!-- Latitude Lines (Grid) -->
  <ellipse cx="128" cy="128" rx="92" ry="36" fill="none" stroke="#00f3ff" stroke-width="2.8" opacity="0.75" />
  <ellipse cx="128" cy="128" rx="92" ry="68" fill="none" stroke="#00f3ff" stroke-width="2.4" opacity="0.5" />
  <line x1="36" y1="128" x2="220" y2="128" stroke="#00f3ff" stroke-width="2.8" opacity="0.8" />

  <!-- Longitude Lines (Grid) -->
  <ellipse cx="128" cy="128" rx="46" ry="92" fill="none" stroke="#00f3ff" stroke-width="2.8" opacity="0.75" />
  <line x1="128" y1="36" x2="128" y2="220" stroke="#00f3ff" stroke-width="2.8" opacity="0.8" />

  <!-- Tilted Orbital Translation Ring -->
  <g transform="rotate(-25 128 128)">
    <ellipse cx="128" cy="128" rx="112" ry="48" fill="none" stroke="#00f3ff" stroke-width="4.5" stroke-dasharray="16 8 4 8" filter="url(#glow-lang)" />
    <!-- Orbiting Satellite Nodes -->
    <circle cx="240" cy="128" r="9" fill="#ffffff" stroke="#9d00ff" stroke-width="3" filter="url(#glow-lang)" />
    <circle cx="16" cy="128" r="8" fill="#00f3ff" stroke="#ffffff" stroke-width="2.5" filter="url(#glow-lang)" />
    <circle cx="128" cy="176" r="6" fill="#ff00bb" filter="url(#glow-lang)" />
  </g>

  <!-- Glowing Pulse Center Core -->
  <circle cx="128" cy="128" r="8.5" fill="#ffffff" filter="url(#glow-lang)" />
</svg>